<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Linga Global School — Admin Upload</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #332c2d;
      color: #292629;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .page {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 20px 50px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
      padding: 18px 20px;
      border-radius: 16px;
      background: #faf7f3;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.2);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .brand h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      font-weight: 600;
    }

    .brand p {
      margin: 3px 0 0;
      color: #716a6c;
      font-size: 12px;
    }

    .logout-btn {
      border: 0;
      border-radius: 9px;
      padding: 10px 15px;
      background: #f1e9e3;
      color: #292629;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .logout-btn:hover {
      background: #e8cdd1;
    }

    .card {
      margin-bottom: 22px;
      padding: 28px;
      border-radius: 18px;
      background: #faf7f3;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.18);
    }

    .card h2 {
      margin: 0 0 7px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
      font-weight: 600;
    }

    .card-description {
      margin: 0 0 24px;
      color: #716a6c;
      font-size: 14px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #292629;
      font-size: 13px;
      font-weight: 600;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid rgba(41, 38, 41, 0.15);
      border-radius: 10px;
      background: #ffffff;
      color: #292629;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }

    input,
    select {
      height: 48px;
      padding: 0 14px;
    }

    textarea {
      min-height: 120px;
      padding: 13px 14px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #c98f9a;
      box-shadow: 0 0 0 3px rgba(201, 143, 154, 0.14);
    }

    .file-input {
      height: auto;
      padding: 12px;
      cursor: pointer;
    }

    .upload-btn {
      width: 100%;
      min-height: 48px;
      margin-top: 4px;
      border: 0;
      border-radius: 10px;
      background: #c98f9a;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .upload-btn:hover {
      background: #b87884;
      transform: translateY(-1px);
    }

    .upload-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      min-height: 20px;
      margin-top: 14px;
      color: #716a6c;
      font-size: 13px;
      line-height: 1.5;
    }

    .success {
      color: #65756b;
    }

    .error {
      color: #a33f4d;
    }

    .documents {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .document {
      position: relative;
      overflow: hidden;
      padding: 18px;
      border: 1px solid rgba(41, 38, 41, 0.08);
      border-radius: 14px;
      background: #ffffff;
    }

    .document h3 {
      margin: 0 0 7px;
      color: #292629;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      font-weight: 600;
    }

    .document p {
      margin: 4px 0;
      color: #716a6c;
      font-size: 12px;
      line-height: 1.5;
    }

    .category {
      display: inline-block;
      margin-bottom: 10px;
      color: #c98f9a;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .delete-btn {
      margin-top: 13px;
      border: 0;
      border-radius: 8px;
      padding: 9px 12px;
      background: #f1e9e3;
      color: #292629;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .delete-btn:hover {
      background: #e8cdd1;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 25px;
      border-radius: 12px;
      background: #ffffff;
      color: #716a6c;
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 700px) {
      .page {
        padding: 18px 14px 35px;
      }

      .topbar {
        align-items: flex-start;
        padding: 15px;
      }

      .brand h1 {
        font-size: 17px;
      }

      .brand img {
        width: 42px;
        height: 42px;
      }

      .logout-btn {
        padding: 9px 11px;
        font-size: 12px;
      }

      .card {
        padding: 21px 17px;
        border-radius: 15px;
      }

      .card h2 {
        font-size: 22px;
      }

      .documents {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <header class="topbar">

      <div class="brand">

        <img
          src="/logo.jpeg"
          alt="Linga Global School"
        />

        <div>
          <h1>Linga Global School</h1>
          <p>Admin Upload Portal</p>
        </div>

      </div>

      <button
        type="button"
        class="logout-btn"
        id="logoutBtn"
      >
        Logout
      </button>

    </header>

    <section class="card">

      <h2>Upload Content</h2>

      <p class="card-description">
        Add gallery photos or school announcements.
      </p>

      <form id="uploadForm">

        <div class="form-group">

          <label for="category">
            Content Type
          </label>

          <select id="category" required>

            <option value="gallery">
              Gallery
            </option>

            <option value="announcement">
              Announcement
            </option>

          </select>

        </div>

        <div class="form-group">

          <label for="title">
            Title
          </label>

          <input
            id="title"
            type="text"
            placeholder="Enter title"
            required
          />

        </div>

        <div
          class="form-group"
          id="descriptionGroup"
        >

          <label for="description">
            Description
          </label>

          <textarea
            id="description"
            placeholder="Enter announcement description"
          ></textarea>

        </div>

        <div class="form-group">

          <label for="file">
            Select File
          </label>

          <input
            id="file"
            class="file-input"
            type="file"
            accept="image/*,.pdf"
            required
          />

        </div>

        <button
          type="submit"
          class="upload-btn"
          id="uploadBtn"
        >
          Upload
        </button>

        <div
          id="message"
          class="message"
        ></div>

      </form>

    </section>

    <section class="card">

      <h2>Uploaded Content</h2>

      <p class="card-description">
        Manage content currently stored on the school website.
      </p>

      <div
        id="documents"
        class="documents"
      ></div>

    </section>

  </div>

  <script>
    const SUPABASE_URL =
      "https://fheuzsampabrzvkogodc.supabase.co";

    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoZXV6c2FtcGFicnp2a29nb2RjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwNzk1MTUsImV4cCI6MjA5ODY1NTUxNX0.RQKsj983dtIuAWoFvC_ZE2EnadaQ8_J-d8-TWoFnYZc";

    const supabase =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

    const uploadForm =
      document.getElementById("uploadForm");

    const uploadBtn =
      document.getElementById("uploadBtn");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const message =
      document.getElementById("message");

    const documents =
      document.getElementById("documents");

    const category =
      document.getElementById("category");

    const descriptionGroup =
      document.getElementById("descriptionGroup");

    const description =
      document.getElementById("description");

    async function checkSession() {

      const {
        data: { session }
      } = await supabase.auth.getSession();

      if (!session) {
        window.location.href =
          "/admin-login.html";
        return false;
      }

      return true;
    }

    async function loadDocuments() {

      documents.innerHTML =
        '<div class="empty">Loading...</div>';

      const {
        data,
        error
      } = await supabase
        .from("documents")
        .select("*")
        .order("created_at", {
          ascending: false
        });

      if (error) {

        console.error(error);

        documents.innerHTML =
          '<div class="empty">Unable to load content.</div>';

        return;
      }

      if (!data || data.length === 0) {

        documents.innerHTML =
          '<div class="empty">No content uploaded yet.</div>';

        return;
      }

      documents.innerHTML = "";

      data.forEach((item) => {

        const card =
          document.createElement("div");

        card.className = "document";

        const date =
          item.created_at
            ? new Date(
                item.created_at
              ).toLocaleDateString(
                "en-IN",
                {
                  day: "numeric",
                  month: "short",
                  year: "numeric"
                }
              )
            : "";

        card.innerHTML = `
          <span class="category">
            ${escapeHtml(item.category || "")}
          </span>

          <h3>
            ${escapeHtml(item.title || "")}
          </h3>

          ${
            item.description
              ? `<p>${escapeHtml(item.description)}</p>`
              : ""
          }

          <p>
            ${date}
          </p>

          <button
            type="button"
            class="delete-btn"
            data-id="${item.id}"
          >
            Delete
          </button>
        `;

        documents.appendChild(card);
      });

      document
        .querySelectorAll(".delete-btn")
        .forEach((button) => {

          button.addEventListener(
            "click",
            () => {
              deleteDocument(button.dataset.id);
            }
          );

        });

    }

    async function deleteDocument(id) {

      const confirmed =
        window.confirm(
          "Are you sure you want to delete this content?"
        );

      if (!confirmed) {
        return;
      }

      const {
        error
      } = await supabase
        .from("documents")
        .delete()
        .eq("id", id);

      if (error) {

        alert(
          "Delete failed: " +
          error.message
        );

        return;
      }

      await loadDocuments();
    }

    uploadForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        const title =
          document
            .getElementById("title")
            .value
            .trim();

        const selectedCategory =
          category.value;

        const selectedDescription =
          description.value.trim();

        const file =
          document
            .getElementById("file")
            .files[0];

        if (!file) {

          message.textContent =
            "Please select a file.";

          message.className =
            "message error";

          return;
        }

        uploadBtn.disabled = true;
        uploadBtn.textContent =
          "Uploading...";

        message.textContent = "";
        message.className = "message";

        try {

          const extension =
            file.name.includes(".")
              ? file.name
                  .split(".")
                  .pop()
                  .toLowerCase()
              : "";

          const folder =
            selectedCategory === "gallery"
              ? "gallery"
              : "announcements";

          const safeFileName =
            file.name.replace(
              /[^a-zA-Z0-9._-]/g,
              "_"
            );

          const filePath =
            `${folder}/${Date.now()}_${safeFileName}`;

          const {
            error: uploadError
          } = await supabase.storage
            .from("school-files")
            .upload(
              filePath,
              file,
              {
                cacheControl: "3600",
                upsert: false
              }
            );

          if (uploadError) {
            throw uploadError;
          }

          const {
            data: publicData
          } = supabase.storage
            .from("school-files")
            .getPublicUrl(filePath);

          const fileUrl =
            publicData.publicUrl;

          const {
            error: insertError
          } = await supabase
            .from("documents")
            .insert({
              title: title,
              description:
                selectedDescription || null,
              file_url: fileUrl,
              file_type:
                file.type ||
                extension ||
                null,
              category:
                selectedCategory
            });

          if (insertError) {
            throw insertError;
          }

          message.textContent =
            "Content uploaded successfully.";

          message.className =
            "message success";

          uploadForm.reset();

          await loadDocuments();

          category.dispatchEvent(
            new Event("change")
          );

        } catch (error) {

          console.error(error);

          message.textContent =
            "Upload failed: " +
            error.message;

          message.className =
            "message error";

        } finally {

          uploadBtn.disabled = false;
          uploadBtn.textContent =
            "Upload";

        }

      }
    );

    category.addEventListener(
      "change",
      () => {

        if (category.value === "gallery") {

          descriptionGroup.style.display =
            "none";

          description.value = "";

        } else {

          descriptionGroup.style.display =
            "block";

        }

      }
    );

    logoutBtn.addEventListener(
      "click",
      async () => {

        await supabase.auth.signOut();

        window.location.href =
          "/admin-login.html";

      }
    );

    function escapeHtml(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }

    async function initialize() {

      const loggedIn =
        await checkSession();

      if (!loggedIn) {
        return;
      }

      category.dispatchEvent(
        new Event("change")
      );

      await loadDocuments();

    }

    initialize();
  </script>

</body>
</html>
