<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Linga Global School — Admin Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #332c2d;
      color: #292629;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: #faf7f3;
      border-radius: 20px;
      padding: 38px 32px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.3);
    }

    .logo-wrap {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      width: 90px;
      height: auto;
      object-fit: contain;
      margin-bottom: 18px;
    }

    .school-name {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 26px;
      font-weight: 600;
      color: #292629;
    }

    .subtitle {
      margin: 8px 0 0;
      font-size: 13px;
      color: #716a6c;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 600;
      color: #292629;
    }

    input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid rgba(41, 38, 41, 0.15);
      border-radius: 10px;
      background: #ffffff;
      color: #292629;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: #c98f9a;
      box-shadow: 0 0 0 3px rgba(201, 143, 154, 0.15);
    }

    button {
      width: 100%;
      height: 48px;
      margin-top: 6px;
      border: 0;
      border-radius: 10px;
      background: #c98f9a;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    button:hover {
      background: #b87884;
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      min-height: 20px;
      margin-top: 16px;
      text-align: center;
      font-size: 13px;
      color: #716a6c;
    }

    .back-link {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: #c98f9a;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }

    .back-link:hover {
      color: #b87884;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .login-card {
        padding: 30px 22px;
        border-radius: 16px;
      }

      .school-name {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <div class="login-card">

    <div class="logo-wrap">
      <img
        src="/logo.png"
        alt="Linga Global School"
        class="logo"
      />

      <h1 class="school-name">
        Linga Global School
      </h1>

      <p class="subtitle">
        Admin Portal
      </p>
    </div>

    <form id="loginForm">

      <div class="form-group">
        <label for="email">Email</label>

        <input
          id="email"
          type="email"
          placeholder="Enter admin email"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          placeholder="Enter password"
          autocomplete="current-password"
          required
        />
      </div>

      <button id="loginBtn" type="submit">
        Login
      </button>

      <div id="message" class="message"></div>

    </form>

    <a href="/" class="back-link">
      ← Back to website
    </a>

  </div>

  <script>
    const SUPABASE_URL =
      "https://fheuzsampabrzvkogodc.supabase.co";

    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoZXV6c2FtcGFicnp2a29nb2RjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwNzk1MTUsImV4cCI6MjA5ODY1NTUxNX0.RQKsj983dtIuAWoFvC_ZE2EnadaQ8_J-d8-TWoFnYZc";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

    const loginForm =
      document.getElementById("loginForm");

    const loginBtn =
      document.getElementById("loginBtn");

    const message =
      document.getElementById("message");

    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;

        message.textContent = "";

        loginBtn.disabled = true;
        loginBtn.textContent = "Logging in...";

        const { error } =
          await supabaseClient.auth.signInWithPassword({
            email,
            password,
          });

        if (error) {

          message.textContent =
            error.message;

          loginBtn.disabled = false;
          loginBtn.textContent = "Login";

          return;
        }

        window.location.href =
          "/admin-upload.html";
      }
    );
  </script>

</body>
</html>
